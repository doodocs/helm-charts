# Fluent Bit Helm Chart Values

# Image configuration
image:
  repository: fluent/fluent-bit
  tag: 4.2.3
  pullPolicy: IfNotPresent

# Service account
serviceAccount:
  create: true
  name: fluent-bit

# RBAC configuration
rbac:
  create: true

# Resource limits
resources:
  limits:
    memory: 256Mi
    cpu: 200m
  requests:
    memory: 64Mi
    cpu: 50m

# Tolerations for scheduling on master/control-plane nodes
tolerations:
  - key: node-role.kubernetes.io/master
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule

# Node selector (optional)
nodeSelector: {}

# Affinity rules (optional)
affinity: {}

# OTLP/HTTP target of the Fluent Bit output.
# Empty host = the collector from this chart (collector.enabled=true).
otlp:
  host: ""
  port: 4318

# OTel collector (Deployment) that labels the logs and exports them to Monium
collector:
  enabled: true
  replicas: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.147.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  memoryLimiter:
    limitMib: 800
    spikeLimitMib: 200
  nodeSelector: {}
  tolerations: []

# Yandex Monium
monium:
  endpoint: ingest.monium.yacloudkz.tech:443
  # Monium project is folder__<folderId>
  folderId: ""
  # Monium cluster label (x-monium-cluster)
  cluster: ""
  # Secret with the Monium API key (scope yc.monium.logs.write); not created by the chart
  existingSecret: monium-credentials
  secretKey: api-key

# Fluent Bit configuration
config:
  # Flush interval in seconds
  flush: 1
  # Log level: debug, info, warn, error
  logLevel: info

  # Input configuration
  input:
    path: /var/log/containers/*.log
    memBufLimit: 50MB
    # Reassembled CRI lines (KEDO 1C payloads ~250 KB) must fit, longer lines are skipped
    bufferMaxSize: 1MB
    skipLongLines: true
    refreshInterval: 10

  # Namespaces to exclude from logging (the agent itself and noisy system namespaces).
  # ingress-nginx stays: its access logs show every request per tenant.
  excludeNamespaces:
    - logging
    - kube-system
    - kube-public
    - kube-node-lease
    - argocd
    - cert-manager
    - external-secrets
    - monitoring
    - prometheus

  # Max disk buffer of the output while the collector is unavailable
  storageTotalLimitSize: 2G

  # Custom parsers (in addition to default cri and json parsers)
  customParsers: ""

  # Additional filters (raw fluent-bit config)
  extraFilters: ""

  # Additional outputs (raw fluent-bit config)
  extraOutputs: ""
