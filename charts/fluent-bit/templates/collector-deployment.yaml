{{- if .Values.collector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fluent-bit.collectorName" . }}
  labels:
    {{- include "fluent-bit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      {{- include "fluent-bit.collectorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fluent-bit.collectorSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/collector-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.collector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otel-collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          args:
            - --config=/conf/config.yaml
          env:
            - name: MONIUM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "monium.existingSecret is required" .Values.monium.existingSecret }}
                  key: {{ .Values.monium.secretKey }}
            - name: MONIUM_FOLDER_ID
              value: {{ required "monium.folderId is required" .Values.monium.folderId | quote }}
            - name: MONIUM_CLUSTER
              value: {{ required "monium.cluster is required" .Values.monium.cluster | quote }}
          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          {{- with .Values.collector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: {{ include "fluent-bit.collectorName" . }}
{{- end }}
