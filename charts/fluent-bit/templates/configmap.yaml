apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fluent-bit.fullname" . }}-config
  labels:
    {{- include "fluent-bit.labels" . | nindent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         {{ .Values.config.flush }}
        Log_Level     {{ .Values.config.logLevel }}
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On
        # Filesystem buffer: records survive collector/Monium outages and agent restarts.
        # New paths: the 1.x state DB and chunks (yc-logging tags) are not reused.
        storage.path              /var/log/fluent-bit-storage-v2
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 50M

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              {{ .Values.config.input.path }}
        # Joins CRI partial lines (P/F); long app lines used to be split into ~16 KB records
        multiline.parser  docker, cri
        DB                /var/log/fluent-bit-state-v2.db
        Mem_Buf_Limit     {{ .Values.config.input.memBufLimit }}
        Buffer_Chunk_Size 64KB
        Buffer_Max_Size   {{ .Values.config.input.bufferMaxSize }}
        Skip_Long_Lines   {{ if .Values.config.input.skipLongLines }}On{{ else }}Off{{ end }}
        Refresh_Interval  {{ .Values.config.input.refreshInterval }}
        storage.type      filesystem

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              Off
        Annotations         Off
        # Cache metadata to reduce API server load
        Kube_Meta_Cache_TTL 60s

    {{- if .Values.config.excludeNamespaces }}
    # Exclude specified namespaces
    [FILTER]
        Name     grep
        Match    kube.*
        Exclude  $kubernetes['namespace_name'] ^({{ join "|" .Values.config.excludeNamespaces }})$
    {{- end }}

    {{- if .Values.config.extraFilters }}
    {{ .Values.config.extraFilters | nindent 4 }}
    {{- end }}

    # Pod logs -> OTel collector -> Monium. The collector sets the Monium labels
    # (cluster, service = namespace), see collector-configmap.yaml.
    [OUTPUT]
        Name                     opentelemetry
        Match                    kube.*
        Host                     {{ include "fluent-bit.otlpHost" . }}
        Port                     {{ .Values.otlp.port }}
        Logs_uri                 /v1/logs
        logs_body_key            $log
        logs_body_key_attributes true
        compress                 gzip
        Retry_Limit              no_limits
        storage.total_limit_size {{ .Values.config.storageTotalLimitSize }}

    {{- if .Values.config.extraOutputs }}
    {{ .Values.config.extraOutputs | nindent 4 }}
    {{- end }}

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    {{- if .Values.config.customParsers }}
    {{ .Values.config.customParsers | nindent 4 }}
    {{- end }}
